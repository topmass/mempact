<!doctype html>

:root {
  color-scheme: light;

  --muted: #6f6e69;

}
html, body { margin: 0; background: transparent; }
body { inline-size: 1200px; }
.card {
  box-sizing: border-box;
  inline-size: 1200px;
  padding: 40px 44px 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
}

.sub { margin: 8px 0 0; font-size: 18px; line-height: 1.4; color: var(--ink-2); }
.note { margin: 18px 0 0; font-size: 16px; line-height: 1.4; color: var(--ink-2); }
svg { display: block; margin-block-start: 28px; font-family: inherit; overflow: visible; }
svg text { font-variant-numeric: tabular-nums; }
.tick { font-size: 16px; fill: var(--ink-2); }
.axis-title { font-size: 16px; fill: var(--ink-2); }
.legend { display: flex; gap: 28px; margin-block-start: 22px; font-size: 17px; color: var(--ink); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { inline-size: 14px; block-size: 14px; border-radius: 50%; }
</style>
</head>
