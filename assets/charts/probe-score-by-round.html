<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Probe score by compaction round</title>
<style>
:root {
  color-scheme: light;
  --surface: #ffffff;
  --border: #d9d8d2;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6e69;
  --grid: #e8e7e1;
  --axis: #c3c2b7;
  --s-mempact: #2a78d6;
  --s-pi: #eb6834;
  --s-ledger: #1baf7a;
  --s-codex: #eda100;
}
html, body { margin: 0; background: transparent; }
body { inline-size: 1200px; }
.card {
  box-sizing: border-box;
  inline-size: 1200px;
  padding: 40px 44px 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
}
h1 { margin: 0; font-size: 30px; font-weight: 650; line-height: 1.2; letter-spacing: -0.01em; }
.sub { margin: 8px 0 0; font-size: 18px; line-height: 1.4; color: var(--ink-2); }
.note { margin: 18px 0 0; font-size: 16px; line-height: 1.4; color: var(--ink-2); }
svg { display: block; margin-block-start: 28px; font-family: inherit; overflow: visible; }
svg text { font-variant-numeric: tabular-nums; }
.tick { font-size: 16px; fill: var(--ink-2); }
.axis-title { font-size: 16px; fill: var(--ink-2); }
.legend { display: flex; gap: 28px; margin-block-start: 22px; font-size: 17px; color: var(--ink); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { inline-size: 14px; block-size: 14px; border-radius: 50%; }
</style>
</head>
<body>
<div class="card">
<h1>What the next window still knows, by compaction round</h1>
<p class="sub">Probe score, mean of 12 real sessions, 64k window, Qwen3.6-35B-A3B</p>
<svg width="1110" height="576" viewBox="0 0 1110 576" role="img" aria-label="Line chart of probe score by compaction round for four compaction methods">
<text class="axis-title" x="0" y="16">Probe score</text>
<line x1="64" x2="880" y1="484.0" y2="484.0" stroke="var(--axis)" stroke-width="1"/>
<text class="tick" x="52" y="489.5" text-anchor="end">0.0</text>
<line x1="64" x2="880" y1="396.0" y2="396.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="52" y="401.5" text-anchor="end">0.2</text>
<line x1="64" x2="880" y1="308.0" y2="308.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="52" y="313.5" text-anchor="end">0.4</text>
<line x1="64" x2="880" y1="220.0" y2="220.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="52" y="225.5" text-anchor="end">0.6</text>
<line x1="64" x2="880" y1="132.0" y2="132.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="52" y="137.5" text-anchor="end">0.8</text>
<line x1="64" x2="880" y1="44.0" y2="44.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="52" y="49.5" text-anchor="end">1.0</text>
<text class="tick" x="94.0" y="512" text-anchor="middle">1</text>
<text class="tick" x="283.0" y="512" text-anchor="middle">2</text>
<text class="tick" x="472.0" y="512" text-anchor="middle">3</text>
<text class="tick" x="661.0" y="512" text-anchor="middle">4</text>
<text class="tick" x="850.0" y="512" text-anchor="middle">5</text>
<text class="tick" x="850.0" y="533" text-anchor="middle" style="font-size:14px">9 sessions</text>
<text class="axis-title" x="472.0" y="564" text-anchor="middle">Compaction round</text>
<polyline points="94.0,246.4 283.0,299.2 472.0,312.4 661.0,338.8 850.0,360.8" fill="none" stroke="var(--s-codex)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="94.0" cy="246.4" r="4.5" fill="var(--s-codex)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="850.0" cy="360.8" r="4.5" fill="var(--s-codex)" stroke="var(--surface)" stroke-width="2"/>
<polyline points="94.0,206.8 283.0,224.4 472.0,290.4 661.0,303.6 850.0,308.0" fill="none" stroke="var(--s-ledger)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="94.0" cy="206.8" r="4.5" fill="var(--s-ledger)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="850.0" cy="308.0" r="4.5" fill="var(--s-ledger)" stroke="var(--surface)" stroke-width="2"/>
<polyline points="94.0,272.8 283.0,272.8 472.0,286.0 661.0,286.0 850.0,277.2" fill="none" stroke="var(--s-pi)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="94.0" cy="272.8" r="4.5" fill="var(--s-pi)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="850.0" cy="277.2" r="4.5" fill="var(--s-pi)" stroke="var(--surface)" stroke-width="2"/>
<polyline points="94.0,180.4 283.0,220.0 472.0,250.8 661.0,255.2 850.0,264.0" fill="none" stroke="var(--s-mempact)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="94.0" cy="180.4" r="5.5" fill="var(--s-mempact)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="283.0" cy="220.0" r="5.5" fill="var(--s-mempact)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="472.0" cy="250.8" r="5.5" fill="var(--s-mempact)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="661.0" cy="255.2" r="5.5" fill="var(--s-mempact)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="850.0" cy="264.0" r="5.5" fill="var(--s-mempact)" stroke="var(--surface)" stroke-width="2"/>
<text x="94.0" y="166.40000000000003" text-anchor="middle" style="font-size:16px;font-weight:600" fill="var(--ink)">0.69</text>
<polyline points="859.0,264.0 874.0,264.0 888.0,257.3" fill="none" stroke="var(--axis)" stroke-width="1"/>
<line x1="896.0" x2="912.0" y1="257.3" y2="257.3" stroke="var(--s-mempact)" stroke-width="4" stroke-linecap="round"/>
<text x="922.0" y="263.3" style="font-size:18px"><tspan fill="var(--ink)" font-weight="700">mempact</tspan><tspan fill="var(--ink-2)" dx="8">0.50</tspan></text>
<polyline points="859.0,277.2 874.0,277.2 888.0,285.3" fill="none" stroke="var(--axis)" stroke-width="1"/>
<line x1="896.0" x2="912.0" y1="285.3" y2="285.3" stroke="var(--s-pi)" stroke-width="3" stroke-linecap="round"/>
<text x="922.0" y="291.3" style="font-size:18px"><tspan fill="var(--ink)" font-weight="500">pi</tspan><tspan fill="var(--ink-2)" dx="8">0.47</tspan></text>
<polyline points="859.0,308.0 874.0,308.0 888.0,313.3" fill="none" stroke="var(--axis)" stroke-width="1"/>
<line x1="896.0" x2="912.0" y1="313.3" y2="313.3" stroke="var(--s-ledger)" stroke-width="3" stroke-linecap="round"/>
<text x="922.0" y="319.3" style="font-size:18px"><tspan fill="var(--ink)" font-weight="500">ledger-only</tspan><tspan fill="var(--ink-2)" dx="8">0.40</tspan></text>
<polyline points="859.0,360.8 874.0,360.8 888.0,354.1" fill="none" stroke="var(--axis)" stroke-width="1"/>
<line x1="896.0" x2="912.0" y1="354.1" y2="354.1" stroke="var(--s-codex)" stroke-width="3" stroke-linecap="round"/>
<text x="922.0" y="360.1" style="font-size:18px"><tspan fill="var(--ink)" font-weight="500">codex prompt</tspan><tspan fill="var(--ink-2)" dx="8">0.28</tspan></text>
</svg>
<p class="note">The same local model summarizes, answers the probes and judges them. Round 5 averages the 9 sessions that reached a fifth compaction.</p>
</div>
</body>
</html>
